<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#0b1220}canvas{display:block}</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// A decorative market scene that loops with no seam: every moving thing is periodic in t over
// LOOP seconds. The data is made up and carries no real prices or addresses.
const W = 1280, H = 720, LOOP = 12;
const ctx = document.getElementById("c").getContext("2d");
const COLORS = { bg: "#0b1220", grid: "#94a3b8", up: "#4ade80", down: "#f87171", amber: "#f59e0b", text: "#94a3b8" };

// Small seeded generator so every render is identical.
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const rand = rng(20261001);

// --- candles: a price walk whose total change is zero, so it tiles when it wraps
const K = 64, SPACING = 20;
const steps = Array.from({ length: K }, () => (rand() - 0.5) * 34);
const mean = steps.reduce((a, b) => a + b, 0) / K;
const price = [0]; for (let i = 0; i < K; i++) price.push(price[i] + steps[i] - mean);
const wick = Array.from({ length: K }, () => [rand() * 14, rand() * 14]);
const volume = Array.from({ length: K }, () => 0.15 + rand() * 0.85);
const CH_TOP = 330, CH_BOTTOM = 600;
const pMin = Math.min(...price), pMax = Math.max(...price);
const py = (p) => CH_BOTTOM - 40 - ((p - pMin) / (pMax - pMin)) * (CH_BOTTOM - CH_TOP - 80);

// --- ticker rows
const ROWS = 26, ROW_H = 28;
const PAIRS = ["BTC/USD", "BTC/EUR", "SAT/USD", "LN/BTC", "BTC/GBP", "BTC/JPY"];
const ticker = Array.from({ length: ROWS }, () => {
  const pair = PAIRS[Math.floor(rand() * PAIRS.length)];
  const move = (rand() - 0.46) * 2.4;
  return { pair, px: (20000 + rand() * 60000).toFixed(2), move, vol: Math.floor(100 + rand() * 9000) };
});

// --- payment flows: bezier arcs between node pairs
const nodes = Array.from({ length: 9 }, (_, i) => ({ x: 90 + (i % 3) * 400 + rand() * 60, y: 70 + Math.floor(i / 3) * 80 + rand() * 30 }));
const flows = Array.from({ length: 16 }, (_, i) => {
  const a = nodes[Math.floor(rand() * nodes.length)]; let b = nodes[Math.floor(rand() * nodes.length)];
  if (b === a) b = nodes[(nodes.indexOf(a) + 1) % nodes.length];
  return { a, b, bend: (rand() - 0.5) * 160, phase: rand(), cycles: 1 + Math.floor(rand() * 2), size: 1.6 + rand() * 1.8 };
});
const bez = (f, u) => {
  const mx = (f.a.x + f.b.x) / 2, my = (f.a.y + f.b.y) / 2 + f.bend;
  const x = (1 - u) ** 2 * f.a.x + 2 * (1 - u) * u * mx + u * u * f.b.x;
  const y = (1 - u) ** 2 * f.a.y + 2 * (1 - u) * u * my + u * u * f.b.y;
  return [x, y];
};

function draw(frame, frames) {
  const t = (frame / frames) % 1; // 0..1 across the loop
  ctx.fillStyle = COLORS.bg; ctx.fillRect(0, 0, W, H);

  // grid
  ctx.strokeStyle = COLORS.grid; ctx.globalAlpha = 0.07; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.globalAlpha = 1;

  // area/line chart across the top
  ctx.beginPath();
  const base = 220, line = [];
  for (let x = 0; x <= W; x += 8) {
    const y = base + 34 * Math.sin(2 * Math.PI * (x / W * 2 + t)) + 18 * Math.sin(2 * Math.PI * (x / W * 5 - 2 * t)) + 8 * Math.sin(2 * Math.PI * (x / W * 11 + 3 * t));
    line.push([x, y]);
  }
  ctx.moveTo(0, H); line.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(W, H); ctx.closePath();
  const g = ctx.createLinearGradient(0, 160, 0, 420); g.addColorStop(0, "rgba(245,158,11,0.16)"); g.addColorStop(1, "rgba(245,158,11,0)");
  ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); line.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.strokeStyle = COLORS.amber; ctx.globalAlpha = 0.85; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;

  // payment flows
  ctx.fillStyle = COLORS.amber;
  for (const n of nodes) { ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.arc(n.x, n.y, 3.2, 0, 7); ctx.fill(); }
  for (const f of flows) {
    ctx.strokeStyle = COLORS.amber; ctx.globalAlpha = 0.10; ctx.lineWidth = 1; ctx.beginPath();
    for (let u = 0; u <= 1.001; u += 0.05) { const [x, y] = bez(f, u); u === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
    const u = (f.phase + t * f.cycles) % 1;
    for (let k = 0; k < 6; k++) { // short fading trail
      const [x, y] = bez(f, Math.max(0, u - k * 0.012));
      ctx.globalAlpha = 0.9 * (1 - k / 6); ctx.fillStyle = COLORS.amber; ctx.beginPath(); ctx.arc(x, y, f.size * (1 - k / 9), 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // candles scrolling left, one full period per loop (kept left of the ticker column)
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 905, H); ctx.clip();
  const scroll = t * K * SPACING;
  for (let n = -1; n <= Math.ceil(W / SPACING) + 1; n++) {
    const x = n * SPACING - (scroll % (K * SPACING));
    const idx = ((n % K) + K) % K;
    const o = price[idx], c = price[idx + 1], hi = Math.max(o, c), lo = Math.min(o, c);
    const col = c >= o ? COLORS.up : COLORS.down;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.globalAlpha = 0.9; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + 7, py(hi) - wick[idx][0]); ctx.lineTo(x + 7, py(lo) + wick[idx][1]); ctx.stroke();
    ctx.fillRect(x + 2, py(hi), 10, Math.max(3, py(lo) - py(hi)));
    ctx.globalAlpha = 0.35; ctx.fillRect(x + 2, 705 - volume[idx] * 62, 10, volume[idx] * 62);
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // ticker on the right, scrolling up, faded at both ends
  ctx.font = "15px monospace"; ctx.textBaseline = "middle";
  const rowScroll = t * ROWS * ROW_H;
  for (let r = -1; r <= Math.ceil(H / ROW_H) + 1; r++) {
    const y = r * ROW_H + 14 - (rowScroll % (ROWS * ROW_H));
    const row = ticker[((r % ROWS) + ROWS) % ROWS];
    const fade = Math.min(1, Math.max(0, y / 90), Math.max(0, (H - y) / 90));
    ctx.globalAlpha = 0.85 * fade;
    ctx.fillStyle = COLORS.text; ctx.fillText(row.pair, 930, y);
    ctx.fillStyle = "#f8fafc"; ctx.fillText(row.px, 1010, y);
    ctx.fillStyle = row.move >= 0 ? COLORS.up : COLORS.down; ctx.fillText(`${row.move >= 0 ? "+" : ""}${row.move.toFixed(2)}%`, 1115, y);
    ctx.fillStyle = COLORS.text; ctx.fillText(String(row.vol), 1195, y);
  }
  ctx.globalAlpha = 1;
}
window.LOOP = LOOP;
window.drawFrame = draw;
draw(0, 1);
</script>
