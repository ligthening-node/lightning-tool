<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#0b1220}canvas{display:block}</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
// A decorative payment-flow scene that loops with no seam: every moving thing is periodic in t over
// LOOP seconds. The data is made up and carries no real prices or addresses.
const W = 1280, H = 720, LOOP = 12;
const ctx = document.getElementById("c").getContext("2d");
const COLORS = { bg: "#0b1220", grid: "#94a3b8", up: "#4ade80", down: "#f87171", amber: "#f59e0b", text: "#94a3b8" };

// Small seeded generator so every render is identical.
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const rand = rng(20261001);
// The removed candles and ticker drew 360 values from this sequence; skipping them keeps the nodes and flows where they were.
for (let i = 0; i < 360; i++) rand();

// --- payment flows: bezier arcs between node pairs
const nodes = Array.from({ length: 9 }, (_, i) => ({ x: 90 + (i % 3) * 400 + rand() * 60, y: 70 + Math.floor(i / 3) * 80 + rand() * 30 }));
const flows = Array.from({ length: 16 }, (_, i) => {
  const a = nodes[Math.floor(rand() * nodes.length)]; let b = nodes[Math.floor(rand() * nodes.length)];
  if (b === a) b = nodes[(nodes.indexOf(a) + 1) % nodes.length];
  return { a, b, bend: (rand() - 0.5) * 160, phase: rand(), cycles: 1 + Math.floor(rand() * 2), size: 1.6 + rand() * 1.8 };
});
const bez = (f, u) => {
  const mx = (f.a.x + f.b.x) / 2, my = (f.a.y + f.b.y) / 2 + f.bend;
  const x = (1 - u) ** 2 * f.a.x + 2 * (1 - u) * u * mx + u * u * f.b.x;
  const y = (1 - u) ** 2 * f.a.y + 2 * (1 - u) * u * my + u * u * f.b.y;
  return [x, y];
};

function draw(frame, frames) {
  const t = (frame / frames) % 1; // 0..1 across the loop
  ctx.fillStyle = COLORS.bg; ctx.fillRect(0, 0, W, H);

  // grid
  ctx.strokeStyle = COLORS.grid; ctx.globalAlpha = 0.07; ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 80) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 80) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.globalAlpha = 1;

  // area/line chart across the top
  ctx.beginPath();
  const base = 220, line = [];
  for (let x = 0; x <= W; x += 8) {
    const y = base + 34 * Math.sin(2 * Math.PI * (x / W * 2 + t)) + 18 * Math.sin(2 * Math.PI * (x / W * 5 - 2 * t)) + 8 * Math.sin(2 * Math.PI * (x / W * 11 + 3 * t));
    line.push([x, y]);
  }
  ctx.moveTo(0, H); line.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(W, H); ctx.closePath();
  const g = ctx.createLinearGradient(0, 160, 0, 420); g.addColorStop(0, "rgba(245,158,11,0.16)"); g.addColorStop(1, "rgba(245,158,11,0)");
  ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); line.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.strokeStyle = COLORS.amber; ctx.globalAlpha = 0.85; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;

  // payment flows
  ctx.fillStyle = COLORS.amber;
  for (const n of nodes) { ctx.globalAlpha = 0.55; ctx.beginPath(); ctx.arc(n.x, n.y, 3.2, 0, 7); ctx.fill(); }
  for (const f of flows) {
    ctx.strokeStyle = COLORS.amber; ctx.globalAlpha = 0.10; ctx.lineWidth = 1; ctx.beginPath();
    for (let u = 0; u <= 1.001; u += 0.05) { const [x, y] = bez(f, u); u === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
    const u = (f.phase + t * f.cycles) % 1;
    for (let k = 0; k < 6; k++) { // short fading trail
      const [x, y] = bez(f, Math.max(0, u - k * 0.012));
      ctx.globalAlpha = 0.9 * (1 - k / 6); ctx.fillStyle = COLORS.amber; ctx.beginPath(); ctx.arc(x, y, f.size * (1 - k / 9), 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
window.LOOP = LOOP;
window.drawFrame = draw;
draw(0, 1);
</script>
